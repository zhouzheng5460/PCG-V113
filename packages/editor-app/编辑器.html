<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Context City PCG · 2D 空间授权</title>
<link rel="icon" href="data:,"/>
<style>
/* 编辑器样式。配色与尺寸照搬 PCG `styles.css`（同一个产品，不该长出第二套语言）。
   只保留这条线用得上的规则，不做主题、不做响应式 —— 桌面编辑器。 */

:root {
  --bg: #0e1014;
  --panel: #14171d;
  --panel-2: #1a1e25;
  --panel-3: #20252e;
  --border: #262c36;
  --border-soft: #1e232b;
  --text: #e6ebf2;
  --dim: #8b95a5;
  --dim-2: #626c7c;
  --accent: #22d3ee;
  --accent-dim: rgba(34, 211, 238, 0.14);
  --warn: #ff6b6b;
  --ok: #4ade80;
  --amber: #f2b544;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: ui-sans-serif, system-ui, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  user-select: none;
}
button { font-family: inherit; color: inherit; cursor: pointer; }
code { font-family: var(--mono); font-size: 11.5px; color: #9fd2ff; }

.app { display: grid; grid-template-rows: 46px 1fr 26px; height: 100vh; }

/* ───────────────── 顶栏 */
.topbar {
  display: flex; align-items: center; gap: 12px; padding: 0 12px;
  background: var(--panel); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: .3px; white-space: nowrap; }
.brand small { color: var(--dim-2); font-weight: 400; font-size: 10.5px; margin-left: 2px; }
.brand-mark {
  width: 16px; height: 16px; border-radius: 4px;
  background: linear-gradient(135deg, #22d3ee, #6366f1);
}
.project-name {
  width: 210px; padding: 5px 8px; border: 1px solid transparent; border-radius: 5px;
  background: var(--panel-2); color: var(--text); font: inherit; font-size: 12.5px; outline: none;
}
.project-name:focus { border-color: #3a5a7d; }
.spacer { flex: 1; }

.seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button {
  padding: 5px 12px; border: none; background: var(--panel-2); color: var(--dim);
  font-size: 12px;
}
.seg button.on { background: var(--accent-dim); color: var(--accent); }

.btn {
  padding: 5px 11px; border: 1px solid var(--border); border-radius: 5px;
  background: var(--panel-2); color: var(--text); font-size: 12px; white-space: nowrap;
}
.btn:hover { border-color: #3a5a7d; }
.btn.primary { background: #164e63; border-color: #0e7490; color: #e0f7ff; }
.btn.primary:hover { background: #155e75; }
.btn.ghost { background: transparent; color: var(--dim); }
.btn.sm { padding: 2px 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* ───────────────── 主区 */
.main { display: grid; grid-template-columns: 74px 1fr 300px; min-height: 0; }

/* 工具栏 */
.toolbar {
  display: flex; flex-direction: column; align-items: stretch; gap: 2px;
  padding: 6px 6px 12px; background: var(--panel); border-right: 1px solid var(--border);
  overflow-y: auto;
}
.toolbar::-webkit-scrollbar { width: 6px; }
.toolbar::-webkit-scrollbar-thumb { background: #263241; border-radius: 3px; }
.tool {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 2px; border: 1px solid transparent; border-radius: 5px;
  background: none; color: var(--dim); font-size: 10.5px; line-height: 1.1;
}
.tool svg { width: 16px; height: 16px; }
.tool:hover { background: var(--panel-2); color: var(--text); }
.tool.on { background: var(--accent-dim); border-color: #1d4b57; color: var(--accent); }
.tool-sep { height: 1px; margin: 5px 2px; background: var(--border-soft); }
.tool-label { padding: 2px 2px 3px; color: var(--dim-2); font-size: 10px; letter-spacing: .5px; }
.mini-grid { display: grid; gap: 3px; }
.mini-grid.c2 { grid-template-columns: 1fr 1fr; }
.mini-grid.c3 { grid-template-columns: repeat(3, 1fr); }
.mini {
  padding: 4px 0; border: 1px solid var(--border); border-radius: 4px;
  background: var(--panel-2); color: var(--dim); font-size: 11.5px;
}
.mini:hover { color: var(--text); border-color: #3a5a7d; }
.mini.dim { opacity: .4; }

/* 画布 */
.stage-wrap { min-width: 0; position: relative; }
.stage { position: absolute; inset: 0; overflow: hidden; }
.stage canvas { display: block; outline: none; }
.canvas-badge {
  position: absolute; left: 10px; bottom: 10px; display: flex; gap: 6px; align-items: center;
  padding: 4px 9px; border: 1px solid var(--border); border-radius: 5px;
  background: rgba(14, 16, 20, .84); color: var(--dim); font-size: 11.5px;
  pointer-events: none;
}
.canvas-badge b { color: var(--text); }
.toast {
  position: absolute; left: 50%; top: 14px; transform: translate(-50%, -8px);
  padding: 6px 14px; border: 1px solid #0e7490; border-radius: 6px;
  background: rgba(22, 78, 99, .95); color: #e0f7ff; font-size: 12px;
  opacity: 0; transition: opacity .15s, transform .15s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.stage-3d-note {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 10px; padding: 40px; text-align: center;
  background: var(--bg); z-index: 3;
}
/* 必须显式写：`.stage-3d-note { display: flex }` 的优先级高于浏览器默认的 [hidden]{display:none}，
   否则这块全屏遮罩一直盖在画布上 —— 表现是"画布什么都点不动、画不出东西"，而且不报错。 */
.stage-3d-note[hidden] { display: none; }
.stage-3d-note h3 { margin: 0; font-size: 15px; }
.stage-3d-note p { margin: 0; max-width: 520px; color: var(--dim); font-size: 12px; line-height: 1.8; }

/* 右栏 */
.side {
  display: flex; flex-direction: column; gap: 0; min-height: 0; overflow-y: auto;
  background: var(--panel); border-left: 1px solid var(--border);
}
.side::-webkit-scrollbar { width: 7px; }
.side::-webkit-scrollbar-thumb { background: #263241; border-radius: 3px; }

.panel { padding: 9px 12px 11px; border-bottom: 1px solid var(--border-soft); }
.panel h3 {
  display: flex; align-items: center; gap: 6px; margin: 2px 0 8px;
  font-size: 11.5px; font-weight: 600; color: #b9c6d4; letter-spacing: .3px;
}
.panel h3 .count { margin-left: auto; font-weight: 400; color: var(--dim-2); font-size: 10.5px; }
.panel summary { cursor: pointer; color: #b9c6d4; font-size: 11.5px; font-weight: 600; }
.panel summary .count { color: var(--dim-2); font-weight: 400; font-size: 10.5px; margin-left: 6px; }

.field { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
.field label { flex: 0 0 84px; color: var(--dim); font-size: 11.5px; }
.field input[type="text"], .field input[type="number"], .field select {
  flex: 1; min-width: 0; padding: 4px 7px; border: 1px solid var(--border); border-radius: 4px;
  background: var(--panel-2); color: var(--text); font: inherit; font-size: 12px; outline: none;
}
.field input:focus, .field select:focus { border-color: #3a5a7d; }

.row { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; font-size: 11.5px; }
.row .k { color: var(--dim); }
.row .v { color: var(--text); font-family: var(--mono); font-size: 11.5px; }

.row-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.empty { margin-top: 6px; color: var(--dim-2); font-size: 11px; line-height: 1.7; }
.kbd {
  display: inline-block; min-width: 15px; padding: 0 4px; margin-right: 2px;
  border: 1px solid var(--border); border-radius: 3px; background: var(--panel-2);
  font-family: var(--mono); font-size: 10px; text-align: center; color: var(--dim);
}
.chip {
  padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 400;
}
.chip.gen { background: #1e293b; color: #93c5fd; }
.chip.user { background: #1f2937; color: #a7f3d0; }
.chip.lock { background: #422006; color: var(--amber); }

/* 图层 */
.layer { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
.layer.off { opacity: .45; }
.layer .ico {
  width: 20px; height: 20px; padding: 0; border: 1px solid transparent; border-radius: 4px;
  background: none; font-size: 11px; line-height: 1;
}
.layer .ico:hover { background: var(--panel-2); }
.layer .ico.lit { color: var(--amber); }
.layer .name { flex: 1; font-size: 11.5px; color: #b9c6d4; }
.layer .num { font-family: var(--mono); font-size: 10.5px; color: var(--dim-2); }

/* 状态栏 */
.statusbar {
  display: flex; align-items: center; gap: 10px; padding: 0 12px;
  background: var(--panel); border-top: 1px solid var(--border);
  color: var(--dim-2); font-size: 11px; white-space: nowrap; overflow: hidden;
}
.statusbar b { color: var(--text); font-family: var(--mono); font-weight: 500; }
.statusbar b.ok { color: var(--ok); }
.statusbar .sep { width: 1px; height: 12px; background: var(--border); }

</style>
</head>

                this.store.setTool(t.dataset.tool);
        });
    }
    bindCanvas() {
        const c = this.canvas;
        c.addEventListener('pointerdown', (e) => {
            c.focus();
            this.ctrl.onPointerDown(e);
        });
        c.addEventListener('pointermove', (e) => this.ctrl.onPointerMove(e));
        c.addEventListener('pointerup', (e) => this.ctrl.onPointerUp(e));
        c.addEventListener('pointerleave', () => this.ctrl.onPointerLeave());
        c.addEventListener('dblclick', (e) => this.ctrl.onDoubleClick(e));
        c.addEventListener('wheel', (e) => this.ctrl.onWheel(e), { passive: false });
        c.addEventListener('contextmenu', (e) => this.ctrl.onContextMenu(e));
    }
    bindKeys() {
        window.addEventListener('keydown', (e) => {
            const t = e.target;
            if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))
                return;
            if (this.ctrl.onKeyDown(e))
                e.preventDefault();
        });
        window.addEventListener('keyup', (e) => this.ctrl.onKeyUp(e));
    }
    setView(v) {
        this.store.patchSettings({ activeView: v });
        const note = this.host.querySelector('#stage-3d-note');
        const cv = this.canvas;
        note.hidden = v !== '3d';
        cv.style.visibility = v === '3d' ? 'hidden' : 'visible';
        this.host.querySelector('#view-2d').classList.toggle('on', v === '2d');
        this.host.querySelector('#view-3d').classList.toggle('on', v === '3d');
    }
    // ───────────────────────────── 生成
    generate(reseed) {
        const { model, view } = this.store.state;
        const sel = view.selectionIds.map((id) => model.objects[id]).filter((o) => !!o && o.kind === 'parcel');
        const parcels = sel.length ? sel : model.order.map((id) => model.objects[id]).filter((o) => !!o && o.kind === 'parcel');
        if (!parcels.length) {
            this.store.showToast('先画一个地块（P）再生成');
            return;
        }
        this.store.pushHistory(reseed ? '换一版生成' : '生成');
        let total = 0;
        const warnings = [];
        for (const p of parcels) {
            const target = reseed ? { ...p, seed: (p.seed + 1) % 100000 } : p;
            if (reseed)
                this.store.updateObject(p.id, { seed: target.seed });
            const all = Object.values(this.store.state.model.objects);
            const res = generateParcel(target, all);
            this.store.applyGenerated(p.id, res.objects, res.stats);
            total += res.stats.buildings;
            if (res.warning)
                warnings.push(`${p.name}：${res.warning}`);
        }
        if (warnings.length)
            this.store.showToast(warnings[0]);
        else
            this.store.showToast(`生成完成：${total} 栋`);
    }
    // ───────────────────────────── 渲染循环
    resize() {
        const host = this.host.querySelector('#stage');
        const r = host.getBoundingClientRect();
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        const w = Math.max(1, r.width);
        const h = Math.max(1, r.height);
        this.canvas.width = Math.round(w * dpr);
        this.canvas.height = Math.round(h * dpr);
        this.canvas.style.width = `${w}px`;
        this.canvas.style.height = `${h}px`;
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        this.cam.setViewport(w, h);
        this.viewW = w;
        this.viewH = h;
    }
    loop = () => {
        requestAnimationFrame(this.loop);
        if (this.store.state.view.activeView !== '2d')
            return;
        this.ctrl.render(this.ctx, this.viewW, this.viewH);
    };
    onStoreChange() {
        if (this.store.version === this.lastVersion)
            return;
        this.lastVersion = this.store.version;
        const key = this.panelKey();
        if (key !== this.lastPanelKey) {
            this.lastPanelKey = key;
            this.renderInspector();
        }
        this.renderLayers();
        this.renderToolStates();
        this.renderBadge();
        this.renderToast();
        this.renderStatus();
        const name = this.host.querySelector('#proj-name');
        if (document.activeElement !== name)
            name.value = this.store.state.model.name;
    }
    /** 面板要不要重建：选中变了、有非静默改动、生成统计变了才重建。
     *  拖动（静默）时不重建 —— 否则输入框每次 move 都失焦。 */
    panelKey() {
        const v = this.store.state.view;
        const gens = Object.keys(this.store.state.genStats).length;
        return `${v.selectionIds.join(',')}|${this.store.version - this.store.silentSeq}|${gens}|${v.activeView}`;
    }
    renderAll() {
        this.renderInspector();
        this.renderLayers();
        this.renderToolStates();
        this.renderBadge();
        this.renderStatus();
    }
    renderToolStates() {
        const v = this.store.state.view;
        this.host.querySelectorAll('.tool[data-tool]').forEach((b) => {
            const el = b;
            if (el.dataset.kind) {
                const on = v.drawKind === el.dataset.kind && v.activeTool !== 'select' && v.activeTool !== 'pan';
                el.classList.toggle('on', on);
            }
            else {
                el.classList.toggle('on', v.activeTool === el.dataset.tool);
            }
        });
        this.host.querySelector('#btn-undo').classList.toggle('dim', this.store.state.past.length === 0);
        this.host.querySelector('#btn-redo').classList.toggle('dim', this.store.state.future.length === 0);
    }
    renderBadge() {
        const v = this.store.state.view;
        const isDraw = v.activeTool !== 'select' && v.activeTool !== 'pan';
        const parts = [`<b>${TOOL_LABEL[v.activeTool]}</b>`];
        if (isDraw)
            parts.push(`<span>· 绘制为 ${DRAW_KIND_LABEL[v.drawKind]}</span>`);
        if (v.activeTool === 'select')
            parts.push('<span>· 拖动移动 / 双击聚焦 / Shift 多选</span>');
        if (isDraw)
            parts.push('<span>· 右键 / 回车 结束 · Esc 退出</span>');
        this.host.querySelector('#badge').innerHTML = parts.join('');
    }
    renderToast() {
        const box = this.host.querySelector('#toast');
        const t = this.store.state.toast;
        if (!t) {
            box.textContent = '';
            box.classList.remove('show');
            return;
        }
        // 长了会横穿画布挡住内容；完整信息在生成面板的读数里，toast 只是提示
        box.textContent = t.length > 46 ? `${t.slice(0, 46)}…` : t;
        box.classList.add('show');
        window.clearTimeout(this._toastTimer);
        this._toastTimer = window.setTimeout(() => {
            this.store.showToast('');
        }, 2400);
    }
    renderStatus() {
        const h = this.store.state.hint ?? EMPTY_HINT;
        const v = this.store.state.view;
        const sel = v.selectionIds.length;
        const n = this.store.state.model.order.length;
        const fmt = (x, d = 2) => x.toFixed(d);
        const el = this.host.querySelector('#statusbar');
        el.innerHTML = `
      <span>X <b>${fmt(h.x)}</b> Y <b>${fmt(h.y)}</b></span><span class="sep"></span>
      <span>长度 <b>${h.length !== undefined ? `${fmt(h.length)} m` : '—'}</b></span>
      <span>角度 <b>${h.angle !== undefined ? `${fmt(h.angle * DEG, 1)}°` : '—'}</b></span>
      <span>面积 <b>${h.area !== undefined ? fmtArea(h.area) : '—'}</b></span><span class="sep"></span>
      <span>Snap: <b class="${h.snapLabel ? 'ok' : ''}">${h.snapLabel || (v.snapEnabled ? 'on' : 'off')}</b></span>
      <span>Grid: <b>${v.gridSize} m</b>${v.gridSnap ? '' : ' (不吸附)'}</span><span class="sep"></span>
      <span>工具 <b>${TOOL_LABEL[v.activeTool]}</b></span>
      <span>选中 <b>${sel}</b></span><span class="sep"></span>
      <span>缩放 <b>${fmt(v.zoom, 2)}</b> px/m</span><span class="sep"></span>
      <span>对象 ${n}</span>`;
    }
    // ───────────────────────────── 图层
    renderLayers() {
        const { model, view } = this.store.state;
        const counts = {};
        for (const id of model.order) {
            const o = model.objects[id];
            if (!o)
                continue;
            const layer = LAYER_OF[o.kind];
            counts[layer] = (counts[layer] ?? 0) + 1;
        }
        const html = `
      <div class="panel">
        <h3>图层 <span class="count">语义层</span></h3>
        ${LAYERS.map((l) => {
            const vis = view.layerVisibility[l.key];
            const lock = view.layerLocked[l.key];
            return `<div class="layer ${vis ? '' : 'off'}">
            <button class="ico ${vis ? 'active' : ''}" data-vis="${l.key}" title="${vis ? '隐藏图层' : '显示图层'}">${vis ? '👁' : '🚫'}</button>
            <button class="ico ${lock ? 'lit' : ''}" data-lock="${l.key}" title="${lock ? '解锁图层' : '锁定图层'}">${lock ? '🔒' : '🔓'}</button>
            <span class="name">${l.label}</span>
            <span class="num">${counts[l.key] ?? 0}</span>
          </div>`;
        }).join('')}
      </div>`;
        const host = this.host.querySelector('#layers');
        host.innerHTML = html;
        host.querySelectorAll('[data-vis]').forEach((b) => b.addEventListener('click', () => this.store.toggleLayerVisible(b.dataset.vis)));
        host.querySelectorAll('[data-lock]').forEach((b) => b.addEventListener('click', () => this.store.toggleLayerLocked(b.dataset.lock)));
    }
    // ───────────────────────────── 属性面板
    renderInspector() {
        const host = this.host.querySelector('#inspector');
        const { model, view } = this.store.state;
        const sel = view.selectionIds.map((id) => model.objects[id]).filter((o) => !!o);
        if (sel.length === 0) {
            host.innerHTML = this.inspectorEmpty();
            this.bindInspectorEmpty(host);
            return;
        }
        if (sel.length > 1) {
            host.innerHTML = `
        <div class="panel">
          <h3>多选 <span class="count">${sel.length} 个对象</span></h3>
          <div class="empty">布尔以 <b>第一个选中</b> 的对象为主对象；<b>减去</b> 只改主对象，被减体保留。</div>
          <div class="row-btns">
            <button class="btn" data-act="dup">复制</button>
            <button class="btn" data-act="lock">锁定 / 解锁</button>
            <button class="btn" data-act="del">删除</button>
          </div>
        </div>`;
            this.bindActs(host);
            return;
        }
        const o = sel[0];
        const paths = areaPaths(o);
        const b = paths ? boundsOfPaths(paths) : null;
        const area = paths ? pathsArea(paths) : 0;
        const per = paths ? pathsPerimeter(paths) : 0;
        const badge = `<span class="chip ${o.origin === 'generated' ? 'gen' : 'user'}">${o.origin === 'generated' ? 'Generated' : 'Fixed'}</span>${o.locked ? '<span class="chip lock">Locked</span>' : ''}`;
        host.innerHTML = `
      <div class="panel">
        <h3>${KIND_LABEL[o.kind]} <span class="count">${badge}</span></h3>
        <div class="field"><label>名称</label><input id="f-name" type="text" value="${esc(o.name)}"/></div>
        <div class="row-btns">
          <button class="btn" data-act="lock">${o.locked ? '解锁' : '锁定'}</button>
          <button class="btn" data-act="fix">转为固定</button>
          <button class="btn" data-act="del">删除</button>
        </div>
      </div>
      ${paths && b && boundsValid(b)
            ? `<div class="panel">
        <h3>几何</h3>
        ${row('面积', fmtArea(area))}
        ${row('周长', `${per.toFixed(2)} m`)}
        ${row('尺寸', `${(b.maxX - b.minX).toFixed(2)} × ${(b.maxY - b.minY).toFixed(2)} m`)}
        ${row('中心', `${ringCenter(paths[0] ?? []).x.toFixed(1)}, ${ringCenter(paths[0] ?? []).y.toFixed(1)}`)}
        ${row('环 / 顶点', `${paths.length} / ${objectVertices(o).length}`)}
      </div>`
            : ''}
      ${this.paramsPanel(o)}
      ${this.genPanel(o)}
      ${isAreaObj(o)
            ? `<div class="panel"><h3>对象操作</h3><div class="row-btns">
          <button class="btn" data-act="dup">复制 (Ctrl+D)</button>
          <button class="btn" data-offset="-3">内缩 3 m</button>
          <button class="btn" data-offset="3">外扩 3 m</button>
        </div></div>`
            : ''}`;
        this.bindActs(host);
        this.bindParams(host, o);
    }
    inspectorEmpty() {
        const { model, view } = this.store.state;
        const counts = { parcel: 0, building: 0, road: 0, access: 0, ground: 0, nobuild: 0 };
        for (const id of model.order) {
            const o = model.objects[id];
            if (!o)
                continue;
            if (o.kind in counts)
                counts[o.kind]++;
        }
        return `
      <div class="panel">
        <h3>项目设置</h3>
        ${numField('网格间距 (m)', view.gridSize, 0.5, 2, 'f-grid')}
        ${toggleField('网格显示', view.gridVisible, 'gridVisible')}
        ${toggleField('网格吸附', view.gridSnap, 'gridSnap')}
        ${toggleField('对象吸附', view.snapEnabled, 'snap')}
      </div>
      <div class="panel">
        <h3>选择过滤 <span class="count">Selection Filter</span></h3>
        <div class="field"><label>仅可选</label>
          <select id="f-filter">
            ${[
            ['all', '全部'],
            ['parcels', '地块'],
            ['buildings', '建筑'],
            ['roads', '道路'],
            ['ground', '地面 / 禁建'],
            ['generated', '仅生成物'],
        ]
            .map(([k, v]) => `<option value="${k}" ${view.selectionFilter === k ? 'selected' : ''}>${v}</option>`)
            .join('')}
          </select>
        </div>
      </div>
      <details class="panel" open>
        <summary>模型统计 <span class="count">${model.order.length} 个对象</span></summary>
        ${row('地块', String(counts.parcel))}
        ${row('建筑', String(counts.building))}
        ${row('道路', String(counts.road))}
        ${row('出入口', String(counts.access))}
        ${row('地面', String(counts.ground))}
        ${row('禁建区', String(counts.nobuild))}
      </details>
      <details class="panel">
        <summary>快捷键 <span class="count">Keyboard</span></summary>
        <div class="empty">
          <span class="kbd">V</span> 选择 · <span class="kbd">R</span> 矩形 · <span class="kbd">P</span> 多边形 ·
          <span class="kbd">L</span> 折线 · <span class="kbd">C</span> 圆 · <span class="kbd">M</span> 测量<br/>
          <span class="kbd">F</span> 聚焦选中 · <span class="kbd">Home</span> 全览 · <span class="kbd">Space</span> 拖拽平移<br/>
          <span class="kbd">G</span> 生成地块 · <span class="kbd">Shift+G</span> 换一版<br/>
          <span class="kbd">Shift</span> 多选 / 45° 约束 · <span class="kbd">Ctrl+Z</span> 撤销 · <span class="kbd">Del</span> 删除
        </div>
      </details>`;
    }
    bindInspectorEmpty(host) {
        const g = host.querySelector('#f-grid');
        g?.addEventListener('change', () => this.store.patchSettings({ gridSize: Math.max(0.05, Number(g.value) || 1) }));
        host.querySelectorAll('[data-tg]').forEach((b) => b.addEventListener('click', () => {
            const k = b.dataset.tg;
            const v = this.store.state.view;
            if (k === 'gridVisible')
                this.store.patchSettings({ gridVisible: !v.gridVisible });
            if (k === 'gridSnap')
                this.store.patchSettings({ gridSnap: !v.gridSnap });
            if (k === 'snap')
                this.store.patchSettings({ snapEnabled: !v.snapEnabled });
        }));
        const f = host.querySelector('#f-filter');
        f?.addEventListener('change', () => this.store.setFilter(f.value));
    }
    /** 按类型的参数块 —— 这就是"工具的界面定义"，一项不能少。 */
    paramsPanel(o) {
        if (o.kind === 'parcel') {
            return `<div class="panel"><h3>地块参数</h3>
        <div class="field"><label>用地类型</label>
          <select id="p-zone">${Object.entries(ZONE_OPTIONS)
                .map(([k, v]) => `<option value="${k}" ${o.zoneKind === k ? 'selected' : ''}>${v}</option>`)
                .join('')}</select>
        </div>
        ${numField('建筑密度', o.density, 0.05, 2, 'p-density')}
        ${numField('容积率', o.far, 0.1, 2, 'p-far')}
        ${numField('高度下限', o.heightRange[0], 1, 0, 'p-hmin')}
        ${numField('高度上限', o.heightRange[1], 1, 0, 'p-hmax')}
        ${numField('Seed', o.seed, 1, 0, 'p-seed')}
        <div class="empty">密度 / 容积率 / 高度区间 / Seed 都真的进生成算法，不是摆设（docs/G §3）。</div>
      </div>`;
        }
        if (o.kind === 'building') {
            return `<div class="panel"><h3>建筑参数</h3>
        ${numField('高度 (m)', o.height, 0.5, 2, 'b-height')}
        ${numField('层数', o.floors, 1, 0, 'b-floors')}
        <div class="field"><label>风格</label>
          <select id="b-style">
            <option value="geometric" ${o.style === 'geometric' ? 'selected' : ''}>Geometric</option>
            <option value="semiRealistic" ${o.style === 'semiRealistic' ? 'selected' : ''}>Semi-Realistic</option>
          </select>
        </div>
        ${toggleField('固定（生成不再改动）', o.fixed, 'b-fixed')}
        ${o.slotId ? `<div class="empty">由楼位 <code>${esc(o.slotId)}</code> 生成。</div>` : ''}
      </div>`;
        }
        if (o.kind === 'road') {
            const len = o.centerline.reduce((s, p, i) => (i ? s + Math.hypot(p.x - o.centerline[i - 1].x, p.y - o.centerline[i - 1].y) : 0), 0);
            return `<div class="panel"><h3>道路参数</h3>
        <div class="field"><label>道路等级</label>
          <select id="r-class">${Object.entries(ROAD_LABEL)
                .map(([k, v]) => `<option value="${k}" ${o.roadClass === k ? 'selected' : ''}>${v}</option>`)
                .join('')}</select>
        </div>
        ${numField('宽度 (m)', o.width, 0.5, 1, 'r-width')}
        ${toggleField('人行道', o.sidewalk, 'r-side')}
        ${row('中心线长度', `${len.toFixed(2)} m`)}
        ${row('控制点', String(o.centerline.length))}
      </div>`;
        }
        if (o.kind === 'access') {
            return `<div class="panel"><h3>出入口</h3>
        ${numField('开口宽度 (m)', o.width, 0.5, 1, 'a-width')}
        ${numField('朝向 (°)', o.dir * DEG, 15, 1, 'a-dir')}
        <div class="field"><label>类型</label>
          <select id="a-type">${Object.entries(ACCESS_LABEL)
                .map(([k, v]) => `<option value="${k}" ${o.accessType === k ? 'selected' : ''}>${v}</option>`)
                .join('')}</select>
        </div>
        <div class="empty">拖动 2D 里的方向箭头可改朝向（按住 Shift 吸附 45°）。</div>
      </div>`;
        }
        if (o.kind === 'ground') {
            return `<div class="panel"><h3>地面 <span class="count">${SURFACE_LABEL[o.surface]}</span></h3>
        <div class="field"><label>表面</label>
          <select id="g-surface">${Object.entries(SURFACE_LABEL)
                .map(([k, v]) => `<option value="${k}" ${o.surface === k ? 'selected' : ''}>${v}</option>`)
                .join('')}</select>
        </div>
        ${row('铺设面积', fmtArea(Math.abs(pathsArea(areaPaths(o) ?? []))))}
        ${o.generatedFrom ? '<div class="empty">这块地面由地块生成；改表面类型会保留，重新生成会被覆盖。</div>' : ''}
      </div>`;
        }
        return '';
    }
    /** 地块的生成面板：读数只在有统计时显示，撤销回到"没统计"就显示提示，不显示上一次的读数。 */
    genPanel(o) {
        if (o.kind !== 'parcel')
            return '';
        const st = this.store.state.genStats[o.id];
        const count = this.store.state.model.order.reduce((n, id) => {
            const x = this.store.state.model.objects[id];
            return x && x.kind === 'building' && x.generatedFrom === o.id ? n + 1 : n;
        }, 0);
        const pct = (v) => `${(v * 100).toFixed(0)}%`;
        return `<div class="panel">
      <h3>生成（TS v0）</h3>
      <div class="row-btns">
        <button class="btn primary" data-gen="1">生成</button>
        <button class="btn" data-gen="reseed">换一版</button>
        <button class="btn ghost" data-gen="clear" ${count ? '' : 'disabled'}>清除生成</button>
      </div>
      ${count === 0
            ? '<div class="empty">尚未生成。生成只写入本图层的 Generated 对象；手绘建筑与"固定"对象不会被改动。</div>'
            : st
                ? `${row('生成建筑', `${count} 栋`)}
               ${row('覆盖率', `${pct(st.coverage)} / 上限 ${pct(o.density)}`)}
               ${row('容积率', `${st.far.toFixed(2)} / 目标 ${o.far.toFixed(2)}`)}
               ${row('最高', `${st.maxHeight.toFixed(1)} m`)}
               ${row('退线', `${st.setback} m`)}
               ${row('退线后可建', fmtArea(st.buildableArea))}
               ${row('净可建', fmtArea(st.freeArea))}
               ${row('街道 / 宗地 / 楼位', `${st.streets} / ${st.zoning} / ${st.slots}`)}`
                : `${row('生成建筑', `${count} 栋（重新生成可查看统计）`)}`}
      <div class="empty">v0 只做：脊街 + 沿街宗地 + 楼位。断街交叉、ready 判定在 G5 接 C#。</div>
    </div>`;
    }
    bindActs(host) {
        host.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => {
            const a = b.dataset.act;
            if (a === 'del')
                this.store.deleteSelected();
            if (a === 'dup')
                this.store.duplicateSelected();
            if (a === 'lock')
                this.store.toggleLock();
            if (a === 'fix')
                this.store.promoteToFixed();
        }));
        host.querySelectorAll('[data-offset]').forEach((b) => b.addEventListener('click', () => this.store.applyOffset(Number(b.dataset.offset))));
        host.querySelectorAll('[data-gen]').forEach((b) => b.addEventListener('click', () => {
            const m = b.dataset.gen;
            const id = this.store.state.view.selectionIds[0];
