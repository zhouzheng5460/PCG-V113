<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>规则验证器 · 街道契约 / ready 判定 / 楼位切分</title>
<link rel="icon" href="data:,"/>
<style>
:root{
  --bg:#0f0f12; --panel:#17171c; --panel2:#1d1d24; --line:#2b2b34;
  --fg:#e8e6e1; --mut:#8b8880; --dim:#5f5e5a;
  --ok:#5dcaa5; --bad:#e24b4a; --warn:#fac775; --acc:#9b8bf0;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:13px/1.65 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  display:flex;flex-direction:column;
}
code{background:#24242c;padding:0 4px;border-radius:3px;font-size:12px;color:#c9c4b8}
header{
  display:flex;align-items:baseline;gap:14px;padding:12px 18px;
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
h1{font-size:16px;font-weight:500;margin:0}
.sub{color:var(--mut);font-size:12px}
.meta{margin-left:auto;color:var(--dim);font-size:12px}

main{flex:1 1 auto;display:grid;grid-template-columns:250px minmax(0,1fr) 372px;min-height:0}
aside{overflow:auto;background:var(--panel);min-height:0}
#left{border-right:1px solid var(--line);padding:10px}
#right{border-left:1px solid var(--line);padding:12px}

/* ── 左栏 */
#search{
  width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
  border-radius:6px;padding:6px 9px;font-size:12px;outline:none;margin-bottom:8px;
}
#search:focus{border-color:#3f3f4c}
.legend{display:flex;gap:10px;color:var(--mut);font-size:11px;margin:0 2px 10px}
.legend span{display:flex;align-items:center;gap:4px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.tagi{background:var(--acc)}

.lgroup{margin-bottom:10px}
.lgh{font-size:11px;color:var(--dim);letter-spacing:.04em;padding:2px 4px;text-transform:none}
.litem{
  display:flex;align-items:center;gap:5px;width:100%;text-align:left;
  background:transparent;border:1px solid transparent;color:var(--fg);
  padding:4px 6px;border-radius:5px;font-size:12px;cursor:pointer;font-family:inherit;
}
.litem:hover{background:var(--panel2)}
.litem.on{background:#262633;border-color:#3b3b4a}
.lid{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10px;padding:0 4px;border-radius:3px;background:#2e2e3a;color:var(--mut);flex:0 0 auto}
.tag.ok{background:#16302a;color:var(--ok)}
.tag.bad{background:#331a1a;color:var(--bad)}

/* ── 中栏 */
#center{overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:0}
#canvas{user-select:none;touch-action:none;display:flex;justify-content:center}
/* 句柄平时小、悬停变亮：22 条街有 66 个句柄，做大了整个画布就只剩黄点 */
#canvas svg{display:block;max-width:100%;max-height:min(600px,62vh);width:auto;height:auto;cursor:default;border-radius:10px}
#canvas .h-st{cursor:grab}
#canvas .h-st:active{cursor:grabbing}
#canvas .h-rg{cursor:crosshair}
#canvas .h-st:hover,#canvas .h-rg:hover{stroke:#fff;stroke-width:2.2}
.hint{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:9px 12px;color:var(--mut);font-size:12px;line-height:1.7;
}
.hint b{color:var(--fg);font-weight:500}
#iso-wrap{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.ihead{font-size:12px;color:var(--fg);margin-bottom:6px}
#iso{display:flex;justify-content:center}
#iso svg{display:block;width:100%;height:auto;max-width:400px}
.empty{color:var(--dim);text-align:center;padding:26px 0;font-size:12px}

/* ── 右栏 */
.pblock{border-bottom:1px solid var(--line);padding:0 0 12px;margin-bottom:12px}
.pblock:last-child{border-bottom:none}
.pblock h3{font-size:12.5px;font-weight:500;margin:0 0 8px;color:var(--fg)}
.ptitle{display:flex;align-items:center;gap:7px;margin-bottom:4px;flex-wrap:wrap}
.ptitle b{font-size:13.5px}
.badge{font-size:10.5px;padding:1px 6px;border-radius:9px;background:#2e2e3a;color:var(--mut)}
.badge.ok{background:#16302a;color:var(--ok)}
.badge.bad{background:#331a1a;color:var(--bad)}
.badge.warn{background:#332a16;color:var(--warn)}
.badge.fam{background:#221f36;color:var(--acc)}
.badge.mut{background:#24242c;color:var(--dim)}
.small{font-size:11.5px;line-height:1.65}
.mut{color:var(--mut)} .bad{color:var(--bad)} .ok{color:var(--ok)} .warn{color:var(--warn)}

.ready{display:flex;gap:8px;margin:6px 0}
.rcol{flex:1 1 0;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
.rlabel{font-size:10.5px;color:var(--dim)}
.rval{font-size:15px;font-weight:500;margin-top:1px}
.rval.ok{color:var(--ok)} .rval.bad{color:var(--bad)} .rval.mut{color:var(--dim)}

.rules{list-style:none;margin:0;padding:0}
.rule{
  display:grid;grid-template-columns:26px 14px minmax(0,1fr);gap:4px 6px;
  padding:3px 0;border-bottom:1px dashed #24242c;font-size:11.5px;
}
.rule:last-child{border-bottom:none}
.rid{color:var(--dim);font-variant-numeric:tabular-nums}
.rmark{text-align:center}
.rule.ok .rmark{color:var(--ok)}
.rule.bad .rmark{color:var(--bad)}
.rule.warn .rmark{color:var(--warn)}
.rt{color:var(--fg)}
.rs{grid-column:3;color:var(--dim);font-size:10.5px;line-height:1.5;overflow:hidden;text-overflow:ellipsis}
.rule.bad .rs{color:#b06a68}

.kv{display:flex;justify-content:space-between;font-size:11.5px;padding:1px 0;color:var(--mut)}
.kv b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.zrow{font-size:11px;padding:2px 0;color:var(--mut)}

.chk{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut);margin:6px 0 0;cursor:pointer}
.chk input{accent-color:var(--acc);margin:0}
button{
  margin-top:10px;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
  border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit;
}
button:hover:not(:disabled){background:#262633}
button:disabled{opacity:.4;cursor:default}

@media (max-width:1100px){
  main{grid-template-columns:1fr}
  #left,#right{border:none;border-top:1px solid var(--line);max-height:240px}
}

</style>

<header>
  <h1>规则验证器</h1>
  <span class="sub">拖街道、拖宗地角点，看 R1–R11 与 <code>ready</code> 判定当场变</span>

  <section id="center">

    <div id="iso-wrap">

      <div id="iso"></div>
    </div>
  </section>

  <aside id="right"><div id="panel"></div></aside>
</main>
