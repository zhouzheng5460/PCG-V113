<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TownForge — 可编辑城市生成器</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <span class="logo">◈</span>
          <span>TownForge</span>
          <em>张量场城市生成器</em>
        </div>
        <div class="views">
          <button class="tab active" data-view="2d">平面编辑</button>
          <button class="tab" data-view="3d">三维预览</button>
        </div>
        <div class="actions">
          <button id="btn-export" class="primary">导出 GLB</button>
        </div>
      </header>

      <div id="body">
        <!-- 左：显示控制 + HUD 分析（看图时最常动的两件事） -->
        <aside id="leftbar"></aside>

        <main id="stage">
          <canvas id="canvas2d"></canvas>
          <!-- 地图工具条：只保留三类主操作（规范 §11）。工具真正的绘制逻辑仍在 view2d 里。 -->
          <div id="maptools">
            <button data-tool="select" class="active" title="选择片区 / 地块 / 留白区">选择</button>
            <button data-tool="area" title="框选若干街区后指定功能">绘制区域</button>
            <button data-tool="blank" title="为后续自定义建筑预留空间">绘制留白区</button>
          </div>
          <!-- 功能配色图例（规范 §12）：颜色直接对应用途，不再靠文字猜 -->
          <div id="legend"></div>
          <div id="view3d"></div>
          <div id="hint"></div>
          <div id="stats"></div>
        </main>

        <!-- 右：属性面板（生成参数，调完就不再动） -->
        <aside id="rightbar"></aside>
      </div>
    </div>
    <script type="module" src="/src/ui/app.ts"></script>
  </body>
</html>
